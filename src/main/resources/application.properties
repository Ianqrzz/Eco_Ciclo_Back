spring.application.name=Eco_Ciclo_Back

# Credenciais lidas de variaveis de ambiente ou de um arquivo .env local (nao versionado).
spring.config.import=optional:file:.env[.properties]

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.data.web.pageable.serialization-mode=via-dto

# Origem do frontend liberada no CORS
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Upload da foto do material (a regra de 5 MB tambem e validada no service)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
